<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的世界音乐转换器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen antialiased flex flex-col items-center py-10 px-4">
    <div class="max-w-5xl w-full flex flex-col gap-8">
        
        <header class="flex items-center gap-3 border-b border-gray-200 pb-4">
            <i data-lucide="music" class="w-8 h-8 text-indigo-600"></i>
            <div>
                <h1 class="text-2xl font-semibold tracking-tight">我的世界音乐转换器</h1>
                <p class="text-sm text-gray-500">将 Minecraft 指令音乐转换为 MineCode 的音乐格式</p>
            </div>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col gap-4">
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-4">
                    <div class="flex items-center gap-3">
                        <label class="font-medium text-sm flex items-center gap-2 whitespace-nowrap">
                            <i data-lucide="settings" class="w-4 h-4 text-gray-400"></i>
                            指令格式:
                        </label>
                        <select id="format_select" class="flex-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="normal" selected>普通指令格式</option>
                            <option value="compressed">压缩指令格式</option>
                        </select>
                        <label class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-md cursor-pointer transition-colors flex items-center gap-2">
                            <i data-lucide="upload" class="w-3 h-3"></i>
                            上传文件
                            <input type="file" id="file_input" class="hidden" accept=".txt,.mcfunction">
                        </label>
                    </div>

                    <div id="format_hint" class="text-xs text-gray-500 p-2 bg-gray-50 rounded border border-gray-200">
                        普通指令格式示例: <code class="text-indigo-600">execute as @a[scores={music=123}] at @s run playsound note.harp @s ~~~ 1.0 0.98765 1.0</code>
                    </div>

                    <textarea id="input_text" class="w-full h-64 p-3 bg-gray-50 border border-gray-200 rounded-lg text-sm font-mono focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none" placeholder="请在此粘贴或上传指令文件...
注：记分板名称不能包含中文"></textarea>
                    
                    <div class="flex items-center gap-3">
                        <label class="text-sm font-medium text-gray-700 whitespace-nowrap">节拍偏移:</label>
                        <input type="number" id="offset_input" value="0" class="flex-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-4">
                    <div class="flex items-center justify-between gap-3">
                        <label class="font-medium text-sm flex items-center gap-2">
                            <i data-lucide="archive" class="w-4 h-4 text-gray-400"></i>
                            批量转换
                        </label>
                        <span class="text-xs text-gray-500">选择 zip 压缩包批量处理</span>
                    </div>

                    <div class="flex items-center gap-3">
                        <label class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-md cursor-pointer transition-colors flex items-center gap-2 whitespace-nowrap">
                            <i data-lucide="file-archive" class="w-3 h-3"></i>
                            选择压缩包
                            <input type="file" id="zip_input" class="hidden" accept=".zip">
                        </label>

                        <input id="zip_filename" type="text" readonly placeholder="未选择压缩包" class="flex-1 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm outline-none text-gray-500">

                        <select id="batch_output_format" class="w-40 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="normal" selected>转普通格式</option>
                            <option value="compressed">转压缩格式</option>
                        </select>
                    </div>

                    <div id="batch_hint" class="text-xs text-gray-500 p-2 bg-gray-50 rounded border border-gray-200">
                        批量处理说明：上传一个 zip 压缩包，内部放置 .txt / .mcfunction 指令音乐文件。转换完成后会自动下载新的 zip 压缩包。
                    </div>

                    <div class="flex items-center gap-3 pt-1">
                        <button id="btn_batch_convert" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition-colors flex justify-center items-center gap-2">
                            <i data-lucide="folder-sync" class="w-4 h-4"></i>
                            批量转换并下载
                        </button>
                    </div>

                    <div id="batch_status" class="hidden text-xs text-gray-600 p-2 bg-gray-50 rounded border border-gray-200 whitespace-pre-wrap"></div>
                </div>
            </div>

            <div class="flex flex-col gap-4">
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-4">
                    <div class="flex justify-between items-center">
                        <label class="font-medium text-sm flex items-center gap-2">
                            <i data-lucide="file-output" class="w-4 h-4 text-gray-400"></i>
                            输出
                        </label>
                        <div class="flex gap-2">
                            <button id="btn_copy" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-md transition-colors flex items-center gap-2">
                                <i data-lucide="copy" class="w-3 h-3"></i> 复制
                            </button>
                            <button id="btn_download" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-md transition-colors flex items-center gap-2">
                                <i data-lucide="download" class="w-3 h-3"></i> 下载
                            </button>
                        </div>
                    </div>
                    <textarea id="output_text" class="w-full h-64 p-3 bg-gray-50 border border-gray-200 rounded-lg text-sm font-mono focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none" readonly placeholder="转换结果将显示在此处..."></textarea>
                    
                    <div class="flex items-center gap-3 pt-1">
                        <button id="btn_convert" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition-colors flex justify-center items-center gap-2">
                            <i data-lucide="arrow-right-left" class="w-4 h-4"></i>
                            格式转换
                        </button>
                        <button id="btn_compress" class="flex-1 bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 rounded-lg transition-colors flex justify-center items-center gap-2">
                            <i data-lucide="minimize" class="w-4 h-4"></i>
                            压缩输出
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
